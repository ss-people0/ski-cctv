name: Collect slope status

on:
  schedule:
    # 매일 09:00 / 10:00 / 16:00(KST)에 수집. GitHub cron은 UTC라 9시간을 뺀다.
    # 00:00 UTC=09:00 KST(개장), 01:00=10:00(오전), 07:00=16:00(오후·마감 전). 5~15분 늦을 수 있음.
    - cron: "0 0,1,7 * * *"
  workflow_dispatch:

concurrency:
  group: collect-slopes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 결과 커밋용
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 scripts/collect_slopes.py --out public/data/slopes.json
        timeout-minutes: 3
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/slopes.json
          git diff --cached --quiet || git commit -m "chore: update slope status"
          git push
