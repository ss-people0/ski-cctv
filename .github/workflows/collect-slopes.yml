name: Collect slope status

on:
  schedule:
    # GitHub cron은 UTC(KST-9). 정각은 실행이 밀리거나 빠지기 쉬워 :17, :47을 쓴다.
    # 휘팍 빼고 매시: 08:17~17:17 KST (23,0~8 UTC). 한두 번 빠져도 그날 값이 남게 한다.
    - cron: "17 23,0-8 * * *"
    # 휘팍만 하루 3회(robots.txt가 /api/ 금지 → 저빈도): 09:47 / 12:47 / 16:47 KST.
    - cron: "47 0,3,7 * * *"
  workflow_dispatch:

concurrency:
  group: collect-slopes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 결과 커밋용
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # 수동 실행은 전체, 예약 실행은 위 두 cron에 따라 나눈다. 안 모은 곳은 기존 값 유지.
      - env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "47 0,3,7 * * *") args="phoenix" ;;
            "") args="" ;;
            *) args="--exclude phoenix" ;;
          esac
          python3 scripts/collect_slopes.py $args --out public/data/slopes.json
        timeout-minutes: 3
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/slopes.json
          git diff --cached --quiet || git commit -m "chore: update slope status"
          # 수집 중에 사람이 main에 올렸으면 그 위에 얹어서 push가 거절되지 않게 한다.
          git pull --rebase
          git push
